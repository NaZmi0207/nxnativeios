name: Build Mario Odyssey iOS (.ipa)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        brew install cmake ninja
        pip install pycryptodome standard-imghdr

    - name: Download Files and Keys
      run: |
        # Создаем папку для игры
        mkdir game_files
        
        # Скачиваем ключи в корень, а распакованные файлы .nsp — сразу в созданную папку
        curl -L -o prod.keys "ССЫЛКА_НА_ВАШ_PROD_KEYS"
        curl -L -o game_files/mario_base.nsp "ССЫЛКА_НА_РАСПАКОВАННУЮ_БАЗУ_NSP"
        curl -L -o game_files/mario_update.nsp "ССЫЛКА_НА_РАСПАКОВАННОЕ_ОБНОВЛЕНИЕ_NSP"

    - name: Run nxnative compilation
      run: |
        # Запускаем компиляцию сразу из папки с файлами .nsp
        python3 build.py --game game_files/

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mario-Odyssey-iOS-IPA
        path: ./*.ipa
