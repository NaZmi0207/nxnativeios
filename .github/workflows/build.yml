name: Build Mario Odyssey iOS (.ipa)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        brew install cmake ninja
        pip install -r requirements.txt

    - name: Download Game and Keys
      run: |
        # Вставьте ваши прямые ссылки ниже
        curl -L -o prod.keys "https://drive.usercontent.google.com/download?id=164d88LgBETdfcJ6fQdVZZkZIItbxaqQ-&export=download&authuser=0"
        curl -L -o mario.nsp "https://drive.usercontent.google.com/download?id=1s2ju2-ehdP28MkCWe02uyxEhkZCnn7SP&export=download&authuser=0&confirm=t&uuid=5ec464a5-51bb-4fdf-bd4e-02f32f810765&at=AMrWOn3W8fwOh8D1WzG5W_J3krGm%3A1793185917446"

    - name: Run nxnative compilation
      run: |
        python3 build.py --game mario.nsp

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mario-Odyssey-iOS-IPA
        path: ./*.ipa
